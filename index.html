<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFO Matematik Arşivi</title>
<style>
:root{
 --bg:#f5f7fb;--panel:#fff;--navy:#20324e;--text:#263447;--muted:#76839a;
 --line:#e2e8f0;--shadow:0 14px 35px rgba(32,50,78,.10);--accent:#5b7fa3;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:275px;position:fixed;inset:0 auto 0 0;background:linear-gradient(180deg,#1e304b,#2f4663);color:#fff;padding:25px 17px;z-index:10;overflow:auto}
.brand{padding:6px 12px 25px}.brand .mini{font-size:12px;letter-spacing:3px;opacity:.55;font-weight:800}.brand h1{margin:8px 0 6px;font-size:26px;line-height:1.04}.brand p{margin:0;color:#cbd5e2;font-size:12px}
.nav-title{padding:10px 12px 7px;font-size:10px;letter-spacing:1.4px;color:#aab8c9;font-weight:700}
.nav button{width:100%;border:0;background:transparent;color:#e4ebf3;padding:10px 12px;border-radius:12px;text-align:left;margin:2px 0}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.11)}
.side-sep{height:1px;background:rgba(255,255,255,.12);margin:14px 10px}
.student-nav{display:flex;flex-direction:column;gap:5px}
.student-chip{border:0;background:rgba(255,255,255,.06);color:#eef3f8;border-radius:11px;padding:10px 11px;text-align:left}
.student-chip:hover{background:rgba(255,255,255,.13)}
.student-chip strong{display:block;font-size:12px}.student-chip small{display:block;color:#b5c2d1;margin-top:2px}
.footer{margin-top:22px;padding:8px 12px;color:#97a7ba;font-size:10px;line-height:1.5}
.main{margin-left:275px;width:calc(100% - 275px);padding:30px 42px}
.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:25px}
.crumb{font-size:12px;color:var(--muted)}
.search{width:min(350px,44vw);padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}
.hero{background:linear-gradient(135deg,#20324e,#476886);border-radius:25px;color:#fff;padding:31px 34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-110px;top:-140px;background:rgba(255,255,255,.07)}
.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;opacity:.6}.hero h2{font-size:33px;line-height:1.08;margin:9px 0 9px}.hero p{margin:0;color:#dce5ee;line-height:1.6;max-width:760px;font-size:13px}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.stat{padding:8px 12px;border-radius:11px;background:rgba(255,255,255,.1);font-size:11px}
.head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 14px}.head h3{margin:0;color:var(--navy);font-size:18px}.head span{font-size:11px;color:var(--muted)}
.grade-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 7px 22px rgba(32,50,78,.05);transition:.16s}
.grade{padding:19px;cursor:pointer;position:relative;overflow:hidden}.grade:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.grade .bar{position:absolute;left:0;top:0;bottom:0;width:5px}.grade .mini{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:1.2px}.grade h4{margin:7px 0 8px;font-size:22px;color:var(--navy)}.grade p{margin:0;color:var(--muted);font-size:12px}.grade .count{margin-top:15px;font-size:11px;font-weight:800;color:var(--navy)}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:9px 12px;border-radius:11px}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:#a83f50}
.btn.small{padding:7px 9px;font-size:11px}
.page-title{display:flex;align-items:center;gap:10px}.page-title h3{margin:0;font-size:27px;color:var(--navy)}.page-title p{margin:3px 0 0;font-size:11px;color:var(--muted)}
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.topic{padding:16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.topic:hover{box-shadow:var(--shadow)}.topic .num{font-size:10px;color:var(--muted);font-weight:800;margin-right:9px}.topic .name{font-size:14px;font-weight:750;color:var(--navy)}
.detail{padding:25px}.detail h3{margin:0 0 4px;font-size:28px;color:var(--navy)}.detail .muted{color:var(--muted);font-size:12px}
.student-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0 20px;padding:13px 15px;border-radius:14px;background:#eef3f8;border:1px solid #dbe4ee}
.student-banner strong{color:var(--navy)}.student-banner span{font-size:11px;color:var(--muted)}
.progress{height:8px;background:#e9eef4;border-radius:20px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:linear-gradient(90deg,#5b7fa3,#8caa62)}
.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--line);background:linear-gradient(135deg,#fbfcfe,#f6f9fc);border-radius:13px;font-size:12px;transition:.15s}
.check:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(32,50,78,.06)}
.check.done{background:linear-gradient(135deg,#eef9e9,#f8fcf6);border-color:#c8dfbf}
.check.done{background:#f1f8ed;border-color:#cfe2c8}.check input{width:17px;height:17px;accent-color:#6b9852}
.notes textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;background:#fbfcfe;outline:none}
.search-results{display:grid;gap:9px}.result{padding:13px 15px;display:flex;justify-content:space-between;align-items:center}
.modal-back{position:fixed;inset:0;background:rgba(16,28,45,.50);display:flex;justify-content:center;align-items:center;padding:20px;z-index:50}
.modal{width:min(520px,100%);background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:24px}.modal h3{margin:0 0 17px;color:var(--navy)}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.student-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.student-card{padding:17px}.student-card h4{margin:0 0 5px;color:var(--navy);font-size:16px}.student-card p{margin:0 0 11px;color:var(--muted);font-size:11px}.student-progress{font-size:10px;color:var(--muted);margin-bottom:7px}
@media(max-width:980px){.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px);padding:22px}.grade-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{display:block}.sidebar{position:static;width:100%}.main{margin:0;width:100%}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.student-list,.topic-grid,.check-grid{grid-template-columns:1fr}.search{width:100%}.topbar{flex-direction:column;align-items:stretch}}

.exam-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.exam-card{background:linear-gradient(135deg,#fff,#f8fafc);border:1px solid var(--line);border-radius:18px;padding:17px;display:grid;grid-template-columns:58px 1fr 20px;gap:13px;align-items:center;cursor:pointer;box-shadow:0 7px 22px rgba(32,50,78,.05);position:relative;overflow:hidden}
.exam-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--exam)}
.exam-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.exam-icon{width:58px;height:58px;border-radius:16px;background:var(--exam);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;letter-spacing:.5px}
.exam-tag{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:1px}.exam-card h4{margin:4px 0;font-size:19px;color:var(--navy)}.exam-card p{margin:0;font-size:10px;color:var(--muted)}.exam-arrow{font-size:19px;color:var(--muted)}
.hero:before{content:"";position:absolute;width:90px;height:90px;border:1px solid rgba(255,255,255,.12);border-radius:24px;right:55px;bottom:-35px;transform:rotate(20deg)}
.nav-title{font-weight:800}
@media(max-width:980px){.exam-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.exam-grid{grid-template-columns:1fr}}

.topic-detail-head{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}
.color-pills{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 20px}
.color-pill{padding:7px 10px;border-radius:99px;font-size:10px;font-weight:800;color:#fff}
.subtopic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.subtopic-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.subtopic-card.done{background:#f1f8ed;border-color:#cfe2c8}
.subtopic-name{font-size:12px;font-weight:700;color:var(--navy)}
.status-dot{width:9px;height:9px;border-radius:50%;background:#c8d1dd;display:inline-block;margin-right:7px}
.subtopic-card.done .status-dot{background:#73a45c}
.lesson-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.lesson-card{padding:15px;border-radius:15px;color:#fff;min-height:90px;box-shadow:0 8px 20px rgba(32,50,78,.08)}

.lesson-card strong{display:block;font-size:12px;margin-bottom:5px}.lesson-card span{font-size:10px;opacity:.85}
.afo-package{margin-top:14px;border:1px solid #dfe7ef;border-radius:18px;background:linear-gradient(135deg,#f8fbfd,#ffffff);padding:18px;box-shadow:0 10px 28px rgba(32,50,78,.06)}
.afo-package-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.afo-package-title{font-size:18px;font-weight:850;color:var(--navy)}.afo-package-sub{font-size:10px;color:var(--muted);margin-top:3px}
.afo-package-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}.afo-package-item{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;transition:.15s}.afo-package-item:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(32,50,78,.08)}.afo-package-item b{display:block;font-size:11px;color:var(--navy)}.afo-package-item span{display:block;font-size:9px;color:var(--muted);margin-top:4px}.afo-package-empty{opacity:.6}
.afo-package-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.afo-package-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#eef3f8;border:1px solid #e0e7ef;color:var(--navy);font-size:9px;font-weight:800}.afo-package-pill.ready{background:#edf8e9;border-color:#cce4c5;color:#4f8847}.afo-package-pill.empty{opacity:.58}.afo-package-cta{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 13px;border-radius:14px;background:linear-gradient(135deg,#20324e,#31506f);color:#fff}.afo-package-cta strong{font-size:11px}.afo-package-cta span{display:block;font-size:9px;opacity:.75;margin-top:2px}.afo-package-cta .btn{background:#fff;color:#20324e;border-color:#fff}.micro-package-btn{border-color:#d7e4ef!important;color:#20324e!important;background:#fff!important}.micro-package-btn:hover{background:#eef5fa!important}
.current-place .path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--muted)}.current-place .path strong{color:var(--navy)}.current-place .mini-note{margin-top:9px;padding:9px 11px;border-radius:10px;background:#f6f8fb;color:var(--muted);font-size:10px;line-height:1.5}
.search-group{margin-top:18px}.search-kind{font-size:10px;font-weight:850;letter-spacing:1px;color:var(--muted);margin:0 0 8px}.search-meta{font-size:10px;color:var(--muted);margin-top:4px}
@media(max-width:850px){.afo-package-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.afo-package-grid{grid-template-columns:1fr}}

@media(max-width:850px){.subtopic-grid{grid-template-columns:1fr}.lesson-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.lesson-grid{grid-template-columns:1fr}}

<style>
.qbank-toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
.filterbar{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.input,.select,.textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}
.question-card{padding:18px;margin-bottom:11px}
.question-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:5px 8px;border-radius:999px;font-size:9px;font-weight:800;background:#eef3f8;color:var(--navy)}
.question-text{margin:13px 0;font-size:14px;line-height:1.65;white-space:pre-wrap}
.option-list{display:grid;gap:7px}.option{border:1px solid var(--line);padding:10px 12px;border-radius:10px;font-size:12px}
.option.correct{background:#eef8e9;border-color:#c8dfbf}
.test-builder{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.sticky-box{position:sticky;top:20px;height:max-content}
.selected-q{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#fafbfd}
.test-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.test-card{padding:18px}
.test-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.assignment{padding:16px;border-left:4px solid var(--accent)}
.student-test{padding:18px;margin-bottom:12px}
.answer-choice{display:block;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0;cursor:pointer}
.answer-choice:hover{background:#f7f9fb}
.answer-choice input{margin-right:8px}
.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.metric{padding:16px;text-align:center}.metric .n{font-size:26px;font-weight:850;color:var(--navy)}.metric .l{font-size:10px;color:var(--muted)}
.mini-table{width:100%;border-collapse:collapse;font-size:11px}.mini-table th,.mini-table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.mini-table th{color:var(--muted);font-size:9px;letter-spacing:.6px}
@media(max-width:850px){.filterbar,.test-builder,.result-grid{grid-template-columns:1fr}.test-list{grid-template-columns:1fr}.sticky-box{position:static}}

<style>
.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:12px}
.resource-card{padding:16px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(135deg,#fff,#f8fafc);display:flex;align-items:center;justify-content:space-between;gap:12px}
.resource-icon{width:45px;height:45px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:12px;flex:none}
.resource-info{min-width:0;flex:1}.resource-info strong{display:block;color:var(--navy);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resource-info span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.resource-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.upload-box{border:2px dashed #cbd6e3;border-radius:15px;padding:18px;text-align:center;background:#fbfcfe;margin-top:10px}
.upload-box:hover{border-color:#8fa7bd}
.file-input{display:none}
.resource-preview{margin-top:15px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#f8fafc}
.resource-preview iframe{width:100%;height:620px;border:0}
.resource-preview img{display:block;max-width:100%;max-height:620px;margin:auto}
.resource-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.resource-tab{padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:11px;cursor:pointer}
.resource-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.teacher-only{background:#fff5ec;border:1px solid #f2d3b0;color:#9a5b24}
@media(max-width:800px){.resource-grid{grid-template-columns:1fr}}

<style>
.material-page{display:grid;grid-template-columns:1fr 340px;gap:18px}
.material-header{padding:23px;border-radius:20px;background:linear-gradient(135deg,#20324e,#466582);color:#fff;box-shadow:var(--shadow)}
.material-header .eyebrow{opacity:.65;font-size:10px;letter-spacing:1.7px;font-weight:800}
.material-header h3{margin:6px 0;font-size:28px}
.material-header p{margin:0;color:#dbe4ed;font-size:12px}
.material-upload{padding:20px}
.material-list{display:grid;gap:10px;margin-top:13px}
.material-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.material-item .resource-info{flex:1;min-width:0}
.material-item .resource-info strong{display:block;color:var(--navy);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.material-item .resource-info span{font-size:10px;color:var(--muted)}
.material-drop{border:2px dashed #c8d5e2;border-radius:16px;padding:24px;text-align:center;background:#fbfcfe;cursor:pointer}
.material-drop:hover{border-color:#8fa9c0;background:#f6f9fc}
.viewer-wrap{margin-top:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#f5f7fa}
.viewer-wrap iframe{width:100%;height:700px;border:0}.viewer-wrap img{display:block;max-width:100%;max-height:700px;margin:auto}
.material-side{position:sticky;top:18px;height:max-content}
.material-side .mini-card{padding:16px;margin-bottom:12px}
.material-side h4{margin:0 0 8px;color:var(--navy);font-size:14px}
.help-text{font-size:10px;line-height:1.6;color:var(--muted)}
@media(max-width:900px){.material-page{grid-template-columns:1fr}.material-side{position:static}}

<style>
.tree{display:grid;gap:9px;margin-top:12px}
.tree-item{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.tree-main{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.tree-main:hover{background:#fafcff}
.tree-main strong{font-size:12px;color:var(--navy)}
.tree-main .tree-meta{font-size:10px;color:var(--muted)}
.tree-chevron{font-size:13px;color:var(--muted);transition:.15s}
.tree-item.open .tree-chevron{transform:rotate(90deg)}
.tree-children{display:none;padding:0 12px 12px 38px;border-top:1px solid #edf0f4;background:#fbfcfe}
.tree-item.open .tree-children{display:grid;gap:7px}
.micro{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;transition:.16s}
.micro.done,.micro.topic-manually-done{background:linear-gradient(135deg,#58a653,#79be69)!important;border-color:#4f984a!important;box-shadow:0 5px 14px rgba(88,166,83,.22)!important}.micro.done input{outline:2px solid rgba(255,255,255,.45);outline-offset:1px}
.micro.done .micro-name,.micro.topic-manually-done .micro-name{color:#fff;font-weight:800}
.micro.done .micro-action,.micro.topic-manually-done .micro-action{color:#fff;font-weight:900;letter-spacing:.4px}
.micro.done input,.micro.topic-manually-done input{accent-color:#fff}

.micro-name{font-size:11px;color:var(--navy);font-weight:650}
.micro-action{font-size:10px;color:var(--muted);white-space:nowrap;display:flex;align-items:center}
.micro input{width:16px;height:16px;accent-color:#73a45c}
.level-label{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:800;color:var(--muted);margin-top:3px}
.level-dot{width:7px;height:7px;border-radius:50%;background:#cbd4df;display:inline-block}
.level-dot.on{background:#73a45c}
.depth-note{font-size:10px;color:var(--muted);margin:0 0 8px 0;line-height:1.5}
.structure-summary{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}
.structure-pill{padding:6px 9px;border-radius:999px;background:#eef3f8;color:var(--navy);font-size:9px;font-weight:800}




<style>
.tree-item.all-done>.tree-main{background:linear-gradient(135deg,#edf8e9,#f7fcf5)}
.tree-item.all-done>.tree-main strong{color:#4f8847}
.tree-item.all-done>.tree-main .level-label{color:#5f914f}
.tree-item.all-done>.tree-main .tree-chevron{color:#5f914f}

async function openResourceDB(){
 return new Promise((resolve,reject)=>{
  if(resourceDb){resolve(resourceDb);return}
  const req=indexedDB.open("AFO_Matematik_Arsivi_DB",2);
  req.onupgradeneeded=e=>{
   const db=e.target.result;
   if(!db.objectStoreNames.contains("resources")) db.createObjectStore("resources",{keyPath:"id"});
   if(!db.objectStoreNames.contains("appState")) db.createObjectStore("appState",{keyPath:"id"});
  };
  req.onsuccess=e=>{resourceDb=e.target.result;resolve(resourceDb)};
  req.onerror=()=>reject(req.error);
 });
}

function appStateSnapshot(){
 return {id:"state",version:1,updatedAt:new Date().toISOString(),students,questions,tests,assignments,results,mockExams,expandedTrees,generalMicroProgress,activeStudentId};
}

async function persistAppState(){
 try{
  const db=await openResourceDB();
  await new Promise((resolve,reject)=>{
   const req=db.transaction("appState","readwrite").objectStore("appState").put(appStateSnapshot());
   req.onsuccess=resolve;req.onerror=()=>reject(req.error);
  });
  return true;
 }catch(e){console.error("AFO veri kaydı başarısız:",e);return false}
}

async function loadAppState(){
 try{
  const db=await openResourceDB();
  const state=await new Promise((resolve,reject)=>{
   const req=db.transaction("appState","readonly").objectStore("appState").get("state");
   req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
  });
  if(state){
   students=Array.isArray(state.students)?state.students:[];
   questions=Array.isArray(state.questions)?state.questions:[];
   tests=Array.isArray(state.tests)?state.tests:[];
   assignments=Array.isArray(state.assignments)?state.assignments:[];
   results=Array.isArray(state.results)?state.results:[];
   mockExams=Array.isArray(state.mockExams)?state.mockExams:[];
   expandedTrees=state.expandedTrees||{};
   generalMicroProgress=state.generalMicroProgress||{};
   activeStudentId=state.activeStudentId||null;
  }else{
   // İlk açılışta mevcut localStorage verisini tek veritabanı katmanına taşır.
   await persistAppState();
  }
  appStateLoaded=true;
 }catch(e){
  console.warn("IndexedDB uygulama verisi yüklenemedi; yerel geri dönüş kullanılıyor.",e);
  appStateLoaded=false;
 }
}

async function loadResources(){
 try{
  const db=await openResourceDB();
  resources=await new Promise((resolve,reject)=>{
   const req=db.transaction("resources","readonly").objectStore("resources").getAll();
   req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);
  });
  resources.forEach(r=>{

    const m=String(r.key||'').match(/^(micro|topic)-(\d+)-(\d+)(?:-(\d+)-(\d+))?$/);
    if(m){r.gradeIndex=+m[2];r.topicIndex=+m[3];r.gradeLabel=data[r.gradeIndex]?.grade||r.gradeLabel;r.topic=data[r.gradeIndex]?.topics?.[r.topicIndex]?.[0]||r.topic;if(m[1]==='micro'&&m[4]!=null){r.microSubIndex=+m[4];r.microIndex=+m[5];const st=detailedStructure(r.topic);r.subtopic=st[r.microSubIndex]?.name||r.subtopic;r.microtopic=st[r.microSubIndex]?.micro?.[r.microIndex]||r.microtopic;}}
   }
  });
 }catch(e){resources=[]}
}

async function removeResource(id){

function studentProgress(s){
 let total=0,score=0;
 data.forEach((g,gi)=>{
   g.topics.forEach((t,ti)=>{
     total++;
     const rec=s.progress?.[topicKey(gi,ti)]||{};
     if(rec.done){ score+=1; return; }
     const st=detailedStructure(t[0]);
     const all=st.reduce((n,x)=>n+x.micro.length,0);
     const completed=st.reduce((n,x,si)=>n+x.micro.filter((_,mi)=>isMicroDone(gi,ti,si,mi,s)).length,0);
     if(all) score += completed/all;
   });
 });
 return total?Math.round(score/total*100):0;
}

function detailedStructure(topic){
 const base=subtopicData[topic]||[`${topic} — temel kavramlar`,`Temel sorular`,`Uygulama`,`Yeni nesil sorular`,`Sık yapılan hatalar`];
 return base.map((sub,si)=>{
   let micro=[];
   const t=sub.toLocaleLowerCase("tr-TR");
   if(t.includes("kavram")||t.includes("tanım")) micro=["Tanım ve temel mantık","Temel örnekler","Kavramı yorumlama","Kazanım kontrolü"];
   else if(t.includes("karşılaştır")||t.includes("sıral")) micro=["Karşılaştırma mantığı","Sıralama yöntemleri","Hızlı yöntemler","Yeni nesil uygulamalar"];
   else if(t.includes("işlem")) micro=["İşlem kuralı","Temel işlemler","Karma işlemler","Sık yapılan hatalar"];
   else if(t.includes("denklem")) micro=["Denklem kurma","Çözüm adımları","Problem uygulamaları","Kontrol ve yorumlama"];
   else if(t.includes("grafik")) micro=["Grafiği okuma","Veri yorumlama","Grafik oluşturma","Yeni nesil grafik soruları"];
   else if(t.includes("alan")) micro=["Alan bağıntısı","Şekil üzerinden alan","Karma alanlar","Problem uygulamaları"];
   else if(t.includes("açı")) micro=["Açı tanımı","Açı ilişkileri","Açı hesaplama","Yeni nesil uygulamalar"];
   else if(t.includes("olasılık")) micro=["Örnek uzay","Olasılık hesaplama","Olasılık karşılaştırma","Problem uygulamaları"];
   else if(t.includes("fonksiyon")) micro=["Fonksiyon kavramı","Tanım ve değer kümeleri","Grafik yorumlama","Uygulamalar"];
   else if(t.includes("türev")) micro=["Türev mantığı","Türev alma","Grafik ve teğet","Uygulamalar"];
   else if(t.includes("integral")) micro=["İntegral mantığı","İntegral alma","Belirli integral","Alan uygulamaları"];
   else if(t.includes("limit")) micro=["Limit mantığı","Sağ ve sol limit","Belirsizlikler","Grafik üzerinden limit"];
   else if(t.includes("trigonometri")) micro=["Temel tanımlar","Birim çember","Trigonometrik oranlar","Uygulamalar"];
   else if(t.includes("dizi")) micro=["Genel terim","Örüntü mantığı","Aritmetik yapı","Geometrik yapı"];
   else if(t.includes("logaritma")) micro=["Logaritma tanımı","Kurallar","Denklemler","Uygulamalar"];
   else if(t.includes("geometri")||t.includes("üçgen")||t.includes("çember")||t.includes("dörtgen")||t.includes("çokgen")) micro=["Temel özellikler","Bağıntılar","Şekil üzerinde uygulama","Yeni nesil sorular"];
   else if(t.includes("sayı")) micro=["Tanım ve temel mantık","Temel örnekler","İşlem ve yorum","Problem uygulamaları"];
   else micro=["Konuya giriş","Temel düzey","Uygulama soruları","Yeni nesil / dikkat edilmesi gerekenler"];
   return {name:sub,micro};
 });
}
function microKey(si,mi){return `${si}-${mi}`}

function isMicroDone(i,j,si,mi,s){
 const key=`${i}-${j}-${microKey(si,mi)}`;
 return s ? !!s.progress?.[topicKey(i,j)]?.micro?.[microKey(si,mi)] : !!generalMicroProgress[key];
}

function collapseAllTrees(i,j){
 const structure=detailedStructure(data[i].topics[j][0]);
 structure.forEach((_,si)=>{
   const key=`${i}-${j}-${si}`;
   expandedTrees[key]=false;
   const el=document.getElementById(`tree-${i}-${j}-${si}`);
   if(el) el.classList.remove("open");
 });
 try{localStorage.setItem("afoExpandedTrees",JSON.stringify(expandedTrees));}catch(e){}
 showTopic(i,j);
}
function toggleTree(i,j,si){
 const el=document.getElementById(`tree-${i}-${j}-${si}`);
 if(!el)return;
 const key=`${i}-${j}-${si}`;
 const open=!el.classList.contains("open");
 if(open) el.classList.add("open");
 else el.classList.remove("open");
 expandedTrees[key]=open;
 try{localStorage.setItem("afoExpandedTrees",JSON.stringify(expandedTrees));}catch(e){}
}
function toggleMicro(i,j,si,mi,v){

 if(s){
   const key=topicKey(i,j);
   s.progress[key]=s.progress[key]||{done:false,sub:{},micro:{}};
   s.progress[key].micro=s.progress[key].micro||{};
   s.progress[key].sub=s.progress[key].sub||{};
   s.progress[key].micro[microKey(si,mi)]=v;
   const st=detailedStructure(data[i].topics[j][0]);
   s.progress[key].sub[si]=st[si].micro.every((_,k)=>!!s.progress[key].micro?.[microKey(si,k)]);
   save();
 }else{
   generalMicroProgress[`${i}-${j}-${microKey(si,mi)}`]=v;
   localStorage.setItem("afoGeneralMicro",JSON.stringify(generalMicroProgress));
 localStorage.setItem("afoMockExams",JSON.stringify(mockExams));
 }
 showTopic(i,j);
}

function progressLabel(s){
 let total=0,done=0;data.forEach((g,gi)=>g.topics.forEach((t,ti)=>{total++;if(s.progress?.[topicKey(gi,ti)]?.done)done++}));
 return `${done} / ${total} konu tamamlandı`;
}

function getStudentTopicStats(s){
 let total=0,done=0,partial=0,notStarted=0;
 const inProgress=[];
 const completed=[];
 const pending=[];
 data.forEach((g,gi)=>{
   g.topics.forEach((t,ti)=>{
     total++;
     const rec=s.progress?.[topicKey(gi,ti)]||{};
     const st=detailedStructure(t[0]);
     const microTotal=st.reduce((n,x)=>n+x.micro.length,0);
     const microDone=st.reduce((n,x,si)=>n+x.micro.filter((_,mi)=>rec.micro?.[microKey(si,mi)]).length,0);
     if(rec.done){done++;completed.push({gi,ti,grade:g.grade,topic:t[0]})}
     else if(microDone>0){partial++;inProgress.push({gi,ti,grade:g.grade,topic:t[0],pct:Math.round(microDone/microTotal*100)})}
     else {notStarted++;pending.push({gi,ti,grade:g.grade,topic:t[0]})}
   })
 });
 return {total,done,partial,notStarted,inProgress,completed,pending};
}
function getCurrentPlace(s){
 const stats=getStudentTopicStats(s);
 const candidate=stats.inProgress[0]||stats.pending[0]||stats.completed[stats.completed.length-1]||null;
 if(!candidate)return null;
 const st=detailedStructure(data[candidate.gi].topics[candidate.ti][0]);
 let targetSi=0,targetMi=0;
 if(stats.inProgress[0]){
   let found=false;
   for(let si=0;si<st.length&&!found;si++) for(let mi=0;mi<st[si].micro.length;mi++){
     if(!isMicroDone(candidate.gi,candidate.ti,si,mi,s)){targetSi=si;targetMi=mi;found=true;break;}
   }
 }else if(stats.pending[0]){ targetSi=0; targetMi=0; }
 else {
   for(let si=st.length-1;si>=0&&!candidate.micro;si--){}
   targetSi=Math.max(0,st.length-1);targetMi=Math.max(0,st[targetSi].micro.length-1);
 }
 const sub=st[targetSi]||{name:"",micro:[]};
 const micro=sub.micro?.[targetMi]||"";
 const rec=s.progress?.[topicKey(candidate.gi,candidate.ti)]||{};
 return {...candidate,si:targetSi,mi:targetMi,sub:sub.name,micro,pct:candidate.pct,teacherNote:rec.note||"",started:!!stats.inProgress.find(x=>x.gi===candidate.gi&&x.ti===candidate.ti)};
}
function gradeProgressForStudent(s,gi){
 const total=data[gi].topics.length;
 let done=0,partial=0;
 data[gi].topics.forEach((t,ti)=>{
   const rec=s.progress?.[topicKey(gi,ti)]||{};
   if(rec.done){done++;return}
   const st=detailedStructure(t[0]);
   const dt=st.reduce((n,x)=>n+x.micro.length,0);
   const dd=st.reduce((n,x,si)=>n+x.micro.filter((_,mi)=>rec.micro?.[microKey(si,mi)]).length,0);
   if(dd>0)partial++;
 });
 return {total,done,partial,pct:total?Math.round((done+partial*.5)/total*100):0};
}

let afoSupabase=null;
function cloudClient(){
 const c=cloudGetConfig();
 if(!c.url||!c.key) throw new Error('Bulut bağlantı bilgileri eksik.');
 if(!afoSupabase || afoSupabase._afoUrl!==c.url || afoSupabase._afoKey!==c.key){
   afoSupabase=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
   afoSupabase._afoUrl=c.url; afoSupabase._afoKey=c.key;
 }
 return afoSupabase;
}

async function cloudUploadArchive(){
 try{
  const {sb,u}=await cloudEnsureReady();
  const localIds=new Set(resources.map(r=>r.id));
  let pushed=0;
  for(const r of resources){
    const path=`${u.id}/${r.id}.${r.type==='pdf'?'pdf':'bin'}`;
    const {error:upErr}=await sb.storage.from('afo-archive').upload(path,r.data,{upsert:true,contentType:r.mime||undefined});
    if(upErr) throw upErr;
    const row={id:r.id,owner_user_id:u.id,grade_index:r.gradeIndex,topic_index:r.topicIndex,grade_label:r.gradeLabel||null,topic:r.topic||null,category:normalizeResourceCategory(r),name:r.name||'Materyal',type:r.type||'pdf',mime:r.mime||null,size:r.size||0,storage_path:path,level:r.microtopic?'micro':'topic',micro_sub_index:r.microSubIndex??null,micro_index:r.microIndex??null,subtopic:r.subtopic||null,microtopic:r.microtopic||null,updated_at:new Date().toISOString()};
    const {error:insErr}=await sb.from('afo_archive_items').upsert(row,{onConflict:'id'}); if(insErr) throw insErr; pushed++;
  }
  setCloudStatus(`${pushed} arşiv materyali buluta gönderildi.`,true); return pushed;
 }catch(e){console.error(e);setCloudStatus('Buluta gönderme başarısız: '+(e.message||e),false);throw e}
}
async function cloudPullArchive(){
 try{
  const {sb,u}=await cloudEnsureReady();
  const {data:rows,error}=await sb.from('afo_archive_items').select('*').eq('owner_user_id',u.id).order('created_at',{ascending:true}); if(error) throw error;
  let added=0,updated=0;
  const localMap=new Map(resources.map(r=>[r.id,r]));
  for(const row of (rows||[])){
    let local=localMap.get(row.id);
    if(local){
      // Metadata güncellemesi; dosya zaten yerelde varsa tekrar indirmiyoruz.
      Object.assign(local,{gradeIndex:row.grade_index,topicIndex:row.topic_index,gradeLabel:row.grade_label,topic:row.topic,category:row.category,name:row.name,type:row.type,mime:row.mime,size:Number(row.size||0),key:row.level==='micro'?topicResourceKey(row.grade_index,row.topic_index,row.micro_sub_index,row.micro_index):topicResourceKey(row.grade_index,row.topic_index),microSubIndex:row.micro_sub_index,microIndex:row.micro_index,subtopic:row.subtopic,microtopic:row.microtopic});
      updated++;
      continue;
    }
    const {data:blobData,error:blobErr}=await sb.storage.from('afo-archive').download(row.storage_path); if(blobErr) throw blobErr;
    const obj={id:row.id,gradeIndex:row.grade_index,topicIndex:row.topic_index,gradeLabel:row.grade_label,topic:row.topic,category:row.category,name:row.name,type:row.type,mime:row.mime,size:Number(row.size||0),data:blobData,key:row.level==='micro'?topicResourceKey(row.grade_index,row.topic_index,row.micro_sub_index,row.micro_index):topicResourceKey(row.grade_index,row.topic_index),microSubIndex:row.micro_sub_index,microIndex:row.micro_index,subtopic:row.subtopic,microtopic:row.microtopic};
    await saveResource(obj); added++;
  }
  await loadResources();
  setCloudStatus(`Buluttan ${added} yeni materyal alındı; ${updated} kayıt güncellendi.`,true); return {added,updated};
 }catch(e){console.error(e);setCloudStatus('Buluttan alma başarısız: '+(e.message||e),false);throw e}
}

 await renderCloudInfo();
}

function showDataManager(){
 page={type:"data"};crumb.textContent="Veri Yönetimi";search.value="";renderSide();
 const kb=(new Blob([JSON.stringify(appStateSnapshot())]).size/1024).toFixed(1);
 content.innerHTML=`<div class="page-title"><div><h3>💾 Veri Yönetimi</h3><p>AFO'nun öğrenci, ilerleme, soru, test ve deneme verileri artık tek IndexedDB katmanında saklanıyor.</p></div></div>
 <div class="result-grid" style="margin-top:18px">
  <div class="card metric"><div class="n">${students.length}</div><div class="l">ÖĞRENCİ</div></div>
  <div class="card metric"><div class="n">${questions.length}</div><div class="l">SORU</div></div>
  <div class="card metric"><div class="n">${tests.length}</div><div class="l">TEST</div></div>
  <div class="card metric"><div class="n">${mockExams.length}</div><div class="l">DENEME</div></div>
 </div>
 <div style="height:16px"></div>
 <section class="card detail"><h3>1. Veri Katmanı</h3><p class="muted" style="line-height:1.7">Ana veri kaynağı: <strong>IndexedDB</strong>. localStorage eski sürüm uyumluluğu için geri dönüş kopyası olarak korunuyor. Böylece sayfa yenilendiğinde veriler uygulamanın ayrı veritabanında kalıyor.</p>
 <div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="exportAfoBackup()">⬇ JSON Yedek Al</button><label class="btn" style="cursor:pointer">⬆ Yedek Geri Yükle<input type="file" accept="application/json,.json" style="display:none" onchange="importAfoBackup(this)"></label></div>
 <p class="muted" style="font-size:10px;margin-top:12px">Son yapılandırılmış veri boyutu: yaklaşık ${kb} KB. PDF/görsel materyaller ayrı IndexedDB deposunda tutulur.</p></section>
 <section class="card detail" style="margin-top:14px"><h3>Sonraki adım</h3><p class="muted" style="line-height:1.7">Bu adım veri kaybı riskini ve dağınık kayıt yapısını düzeltiyor. <strong>Henüz bulut senkronizasyonu yok</strong>; sonraki mimari adım öğretmen hesabı + güvenli sunucu veritabanı olacak.</p></section>`;
}

search.oninput=()=>{
 const q=search.value.trim().toLocaleLowerCase("tr-TR");
 if(!q){
   const restore={home:()=>home(),grade:()=>showGrade(page.grade),topic:()=>showTopic(page.grade,page.topic),students:()=>showStudents(),student:()=>showStudent(page.student),exam:()=>showExam(page.exam),questions:()=>showQuestionBank(),tests:()=>showTests(),assignments:()=>showAssignments(),results:()=>showResults(),builder:()=>showTestBuilder(),materialPage:()=>showMaterialPage(page.grade,page.topic,page.category),microMaterial:()=>showMicroMaterialPage(page.grade,page.topic,page.si,page.mi),lessonPackage:()=>showLessonPackage(page.grade,page.topic,page.si,page.mi),mocks:()=>showMockExams(),data:()=>showDataManager(),cloud:()=>showCloudSync(),archive:()=>renderArchiveManager(),archiveClasses:()=>showAllTopics()};
   (restore[page.type]||home)(); return;
 }
 const topicResults=[],subResults=[],microResults=[],materialResults=[],studentResults=[];
 data.forEach((g,gi)=>g.topics.forEach((t,ti)=>{
   const topicText=(g.grade+" "+t[0]+" "+(t[1]||[]).join(" ")).toLocaleLowerCase("tr-TR");
   if(topicText.includes(q)) topicResults.push({g,gi,t,ti});
   const st=detailedStructure(t[0]);
   st.forEach((sub,si)=>{
     if((g.grade+" "+t[0]+" "+sub.name).toLocaleLowerCase("tr-TR").includes(q)) subResults.push({g,gi,t,ti,sub,si});
     sub.micro.forEach((m,mi)=>{if((g.grade+" "+t[0]+" "+sub.name+" "+m).toLocaleLowerCase("tr-TR").includes(q)) microResults.push({g,gi,t,ti,sub,si,m,mi})});
   });
 }));
 students.forEach(s=>{if((s.name+" "+s.grade).toLocaleLowerCase("tr-TR").includes(q))studentResults.push(s)});
 resources.forEach(r=>{const hay=[r.name,r.topic,r.subtopic,r.microtopic,r.gradeLabel,r.category].filter(Boolean).join(" ").toLocaleLowerCase("tr-TR");if(hay.includes(q))materialResults.push(r)});
 const total=topicResults.length+subResults.length+microResults.length+materialResults.length+studentResults.length;
 crumb.textContent="Arama";renderSide();
 content.innerHTML=`<div class="page-title"><div><h3>Arama</h3><p>${total} sonuç bulundu</p></div></div>
 ${studentResults.length?`<div class="search-group"><div class="search-kind">ÖĞRENCİLER</div><div class="search-results">${studentResults.map(s=>`<article class="card result" onclick="showStudent('${s.id}')"><div><strong>${esc(s.name)}</strong><div class="search-meta">${esc(s.grade)} • %${studentProgress(s)}</div></div><span>→</span></article>`).join('')}</div></div>`:''}
 ${topicResults.length?`<div class="search-group"><div class="search-kind">ANA KONULAR</div><div class="search-results">${topicResults.map(x=>`<article class="card result" onclick="showTopic(${x.gi},${x.ti},'archive')"><div><div class="search-meta">${esc(x.g.grade)}</div><div style="font-weight:750;color:var(--navy)">${esc(x.t[0])}</div></div><span>→</span></article>`).join('')}</div></div>`:''}
 ${subResults.length?`<div class="search-group"><div class="search-kind">ALT KONULAR</div><div class="search-results">${subResults.slice(0,40).map(x=>`<article class="card result" onclick="showTopic(${x.gi},${x.ti},'archive')"><div><div class="search-meta">${esc(x.g.grade)} • ${esc(x.t[0])}</div><div style="font-weight:700;color:var(--navy)">${esc(x.sub.name)}</div></div><span>→</span></article>`).join('')}</div></div>`:''}
 ${microResults.length?`<div class="search-group"><div class="search-kind">MİKRO KONULAR</div><div class="search-results">${microResults.slice(0,60).map(x=>`<article class="card result" onclick="showMicroMaterialPage(${x.gi},${x.ti},${x.si},${x.mi})"><div><div class="search-meta">${esc(x.g.grade)} • ${esc(x.t[0])} • ${esc(x.sub.name)}</div><div style="font-weight:700;color:var(--navy)">${esc(x.m)}</div><div class="search-meta">📦 Ders paketini aç</div></div><span>→</span></article>`).join('')}</div></div>`:''}
 ${materialResults.length?`<div class="search-group"><div class="search-kind">ARŞİV MATERYALLERİ</div><div class="search-results">${materialResults.slice(0,60).map(r=>`<article class="card result" onclick="${r.microtopic?`showMicroMaterialPage(${r.gradeIndex},${r.topicIndex},${r.microSubIndex||0},${r.microIndex||0})`:`showMaterialPage(${r.gradeIndex},${r.topicIndex},'${esc(normalizeResourceCategory(r)).replace(/'/g,"\'")}')`}"><div><div style="font-weight:750;color:var(--navy)">${esc(r.name)}</div><div class="search-meta">${esc(r.gradeLabel||'')} • ${esc(r.topic||'')} • ${esc(normalizeResourceCategory(r))}</div></div><span>→</span></article>`).join('')}</div></div>`:''}
 ${!total?`<div class="empty" style="margin-top:18px">Aradığın konu, mikro konu, öğrenci veya materyal bulunamadı.</div>`:''}`;
}

(function bootAfo(){
  // AFO önce açılır; veri yükleme sonradan arka planda tamamlanır.
  try{ renderSide(); showWelcome(); }catch(e){
    console.error("AFO açılış hatası:",e);
    try{ document.body.classList.remove("afo-welcome-mode"); renderSide(); home(); }catch(_){}
  }
  Promise.allSettled([loadAppState(),loadResources()]).then(()=>{
    try{
      if(page.type!=="welcome" && page.type!=="topic" && page.type!=="student" && page.type!=="archiveClasses" && page.type!=="archive"){ renderSide(); }
    }catch(e){ console.warn("AFO arka plan veri yenileme uyarısı",e); }
  });
})();
</script>
